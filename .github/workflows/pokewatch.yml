name: PokeWatch

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 minutes (GitHub's practical floor; runs are best-effort and may lag)
  workflow_dispatch: {}       # lets you trigger a check manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: pokewatch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Pokemon Center
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          OPTCG_WEEZTIX: ${{ secrets.OPTCG_WEEZTIX }}
        run: python3 check.py

      - name: Save state
        run: |
          git config user.name "pokewatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "state update"
          git pull --rebase || true
          git push
