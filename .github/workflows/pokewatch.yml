name: PokeWatch

on:
  schedule:
    - cron: "*/5 * * * *"    # heartbeat: restart the loop within 5 min if it ever dies
  workflow_dispatch: {}

permissions:
  contents: write

# Only one loop runs at a time. A scheduled trigger during an active loop waits
# pending, then starts the instant the active run ends -> near-seamless handoff.
concurrency:
  group: pokewatch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Watch loop (checks every ~20s for ~55 min)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          OPTCG_WEEZTIX: ${{ secrets.OPTCG_WEEZTIX }}
          INTERVAL: "20"
          LOOP_SECONDS: "3300"
        run: python3 check.py --loop

      - name: Save state
        if: always()
        run: |
          git config user.name "pokewatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || git commit -m "state update"
          git pull --rebase || true
          git push || true
